<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soontra Workflow Audit</title><style>:root{--b:#080808;--p:#151515;--l:#303030;--t:#f5f3ef;--m:#aaa;--g:#5bd699;--y:#f4c95d;--r:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:22px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--t);text-decoration:none;border:1px solid var(--l);padding:8px 11px;border-radius:999px}h1{font-size:clamp(34px,7vw,70px);line-height:.95;letter-spacing:-.05em}.lead,.muted{color:var(--m)}.grid{display:grid;gap:12px;margin-top:22px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px}.row{display:flex;justify-content:space-between;gap:12px}.pill{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:10px;text-transform:uppercase}.testing,.manual{color:var(--y)}.pass{color:var(--g)}.blocked{color:var(--r)}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.details div{background:#0c0c0c;padding:10px;border-radius:9px}.details b{display:block;color:var(--m);font-size:10px;text-transform:uppercase;margin-bottom:4px}@media(max-width:700px){.details{grid-template-columns:1fr}.row{display:block}.pill{display:inline-block;margin-top:8px}}</style></head><body><main><nav class="nav"><a href="./hq.html">Team HQ</a><a href="./">Operations</a><a href="./bugs.html">Bugs and Improvements</a></nav><h1>Soontra Workflow Audit</h1><p class="lead">Live evidence matrix for the Creator Club intake-to-learning pilot. A row passes only after current-product proof. Manual means Monday has a safe operator fallback.</p><div id="meta" class="muted">Loading...</div><div id="grid" class="grid"></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('workflow-audit.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{meta.textContent=`Overall: ${d.overall} · Updated ${d.updatedAt}`;grid.innerHTML=d.rows.map(x=>`<article class="card"><div class="row"><div><div class="muted">${e(x.criterion)}</div><h2>${e(x.step)}</h2></div><span class="pill ${e(x.verdict)}">${e(x.verdict)}</span></div><div class="details"><div><b>Live evidence</b>${e(x.evidence)}</div><div><b>Monday fallback</b>${e(x.fallback)}</div><div><b>Product gap</b>${e(x.gap)}</div></div></article>`).join('')})</script></body></html>
