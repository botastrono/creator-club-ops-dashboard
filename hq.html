<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team HQ</title><style>:root{--b:#080808;--p:#151515;--l:#303030;--t:#f5f3ef;--m:#aaa;--o:#ff5a1f;--g:#5bd699;--y:#f4c95d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:22px}.ey{color:var(--o);font-size:11px;font-weight:900;letter-spacing:.15em}h1{font-size:clamp(40px,8vw,82px);line-height:.9;letter-spacing:-.06em}.lead{color:var(--m);font-size:18px;max-width:720px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}.card{display:block;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:20px;color:var(--t);text-decoration:none;min-height:170px}.card:hover{border-color:var(--o);transform:translateY(-2px)}.row{display:flex;justify-content:space-between;gap:10px}.pill{border:1px solid currentColor;border-radius:999px;padding:3px 8px;font-size:10px;text-transform:uppercase}.live{color:var(--g)}.working,.local{color:var(--y)}.meta{color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:145px}}</style></head><body><main><div class="ey">MATT + MUSE + OPENCLAW</div><h1>Team HQ</h1><p class="lead">One place to open every active system, dashboard, audit, and experiment.</p><div class="grid" id="grid">Loading...</div><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('projects.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.json()).then(d=>grid.innerHTML=d.projects.map(x=>`<a class="card" href="${e(x.url)}"><div class="row"><strong>${e(x.name)}</strong><span class="pill ${e(x.status)}">${e(x.status)}</span></div><p>${e(x.description)}</p><div class="meta">Owner: ${e(x.owner)}</div></a>`).join(''))</script></main></body></html>
