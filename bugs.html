<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soontra Bugs and Improvements</title>
  <style>
    :root{--b:#080808;--p:#151515;--l:#303030;--t:#f5f3ef;--m:#aaa;--o:#ff5a1f;--g:#5bd699;--y:#f4c95d;--r:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:22px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--t);text-decoration:none;border:1px solid var(--l);padding:8px 11px;border-radius:999px}h1{font-size:clamp(34px,7vw,70px);line-height:.95;letter-spacing:-.05em}.lead{color:var(--m);font-size:17px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:999px;padding:8px 12px;cursor:pointer}.grid{display:grid;gap:12px}.item{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800}.P0{color:var(--r)}.P1{color:var(--y)}.P2,.live{color:var(--g)}.meta{color:var(--m);font-size:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.details div{background:#0c0c0c;padding:10px;border-radius:9px}.details b{display:block;color:var(--m);font-size:10px;text-transform:uppercase;margin-bottom:4px}a{color:#78adff}@media(max-width:700px){.details{grid-template-columns:1fr}.row{display:block}.row .pill{margin-top:8px}}
  </style>
</head>
<body>
  <main>
    <nav class="nav"><a href="./hq.html">Team HQ</a><a href="./">Operations</a><a href="./bugs.html">Bugs and Improvements</a></nav>
    <h1>Soontra Bugs<br>and Improvements</h1>
    <p class="lead">Verified defects, workflow friction, feature ideas, and customer requests. This page is written for product and engineering action.</p>
    <div class="bar" id="filters"></div>
    <div class="grid" id="items">Loading...</div>
  </main>
  <script>
    let data;
    const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){
      data=await(await fetch('bugs.json?t='+Date.now(),{cache:'no-store'})).json();
      const types=['All',...new Set(data.items.map(x=>x.type))];
      filters.innerHTML=types.map(x=>`<button data-type="${e(x)}">${e(x)}</button>`).join('');
      filters.onclick=x=>{if(x.target.dataset.type)render(x.target.dataset.type)};
      render('All');
    }
    function render(type){
      const a=type==='All'?data.items:data.items.filter(x=>x.type===type);
      items.innerHTML=a.map(x=>`<article class="item"><div class="row"><div><div class="meta">${e(x.id)} · ${e(x.type)} · ${e(x.workflow)}</div><h2>${e(x.title)}</h2></div><span class="pill ${e(x.severity)}">${e(x.severity)} · ${e(x.status)}</span></div><div class="details"><div><b>Problem</b>${e(x.problem)}</div><div><b>Expected</b>${e(x.expected)}</div><div><b>Evidence</b>${e(x.evidence)}</div><div><b>Proposed</b>${e(x.proposed)}</div><div><b>Owner</b>${e(x.owner)}</div><div><b>Source</b><a href="${e(x.source)}">View source</a></div><div><b>Last update</b>${e(x.updatedAt)}</div></div></article>`).join('');
    }
    load();
  </script>
</body>
</html>
